; ------------------------------------------------------------------------- ;
; php-fpm pool "www"                                                         ;
;                                                                            ;
; Overrides the stock pool shipped with Alpine (which listens on 127.0.0.1): ;
; nginx runs in another container and must reach php-fpm over the internal   ;
; docker network, so we listen on 0.0.0.0:9000.                              ;
; ------------------------------------------------------------------------- ;

[www]
user = nobody
group = nobody

listen = 0.0.0.0:9000
listen.owner = nobody
listen.group = nobody

pm = dynamic
pm.max_children = 10
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

catch_workers_output = yes
clear_env = no
security.limit_extensions = .php
